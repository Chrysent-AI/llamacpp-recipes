spec-draft-type-v = q8_0
model-draft = .runtime/models/gemma4-mtp.gguf
spec-draft-ngl = all
spec-draft-device = MTL0
temp = 1
top-p = 0.95
top-k = 64
min-p = 0
presence-penalty = 0
repeat-penalty = 1

