; Native llama.cpp router presets measured on Apple M2 Pro / 32 GiB.
; Copy only sections whose files you have into ignored local/models.ini.
; Paths below are generic symlink names, relative to the repository root.
; Create those links or replace the paths in your PRIVATE copy; no downloads occur.
; Model IDs match examples/pi-models-moe.json. Keep the same IDs in Pi.
; 262144 is configured capacity, not demonstrated fully occupied performance.
; Results and caveats: docs/benchmarks/moe-256k.md.
version = 1

[*]
ctx-size = 262144
parallel = 1
n-gpu-layers = all
device = MTL0
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
ctx-checkpoints = 2
cache-ram = 0
fit = off
no-context-shift = true
jinja = true
n-predict = 4096
reasoning-budget = 1024
reasoning-format = deepseek
load-on-startup = false

; Existing dense control. Pi may override sampling and thinking per request.
[qwen3.8-27b]
model = .runtime/models/qwen3.8-27b.gguf
mmproj = .runtime/models/qwen3.8-mmproj.gguf
spec-type = draft-mtp
spec-draft-n-max = 4
spec-draft-n-min = 0
reasoning-effort = low
chat-template-kwargs = {"preserve_thinking":true}
temp = 1
top-p = 0.95
top-k = 20
min-p = 0
presence-penalty = 0
repeat-penalty = 1

; Qwen3.6 MoE: embedded MTP, matching projector, precise-coding sampling.
[qwen36-q2-k-xl-d4]
model = .runtime/models/qwen36-q2-k-xl.gguf
mmproj = .runtime/models/qwen36-mmproj.gguf
spec-type = draft-mtp
spec-draft-n-max = 4
spec-draft-n-min = 0
spec-draft-type-k = q8_0
spec-draft-type-v = q8_0
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0
presence-penalty = 0
repeat-penalty = 1

